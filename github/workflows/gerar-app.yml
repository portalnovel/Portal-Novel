name: Gerar App Play Store
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java e Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Gerar Projeto Android e Compilar AAB
        run: |
          mkdir app && cd app
          bubblewrap init --manifest="https://portalnovel.com.br" --directory=. <<EOF
          portalnovel.com.br
          Portal Novel
          Portal Novel
          br.com.portalnovel.app
          /#inicio
          #000000
          #ffffff
          https://portalnovel.com.br
          https://portalnovel.com.br
          no
          android.keystore
          android
          Portal Novel
          Portal Novel
          BR
          portalnovel
          portalnovel
          EOF
          bubblewrap build --skipPwaValidation <<EOF
          portalnovel
          portalnovel
          EOF
          bubblewrap fingerprint generateAssetLinks --manifest="https://portalnovel.com.br"

      - name: Disponibilizar Arquivos para Download
        uses: actions/upload-artifact@v4
        with:
          name: portal-novel-playstore
          path: |
            app/app-release-bundle.aab
            app/app-release-signed.apk
            app/android.keystore
            app/assetlinks.json
            
