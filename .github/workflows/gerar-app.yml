name: Gerar App Play Store
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Gerar App Android
        run: |
          mkdir app && cd app
          printf "portalnovel.com.br\nPortal Novel\nPortal Novel\nbr.com.portalnovel.app\n/#inicio\n#000000\n#ffffff\nhttps://portalnovel.com.br\nhttps://portalnovel.com.br\nno\nandroid.keystore\nandroid\nPortal Novel\nPortal Novel\nBR\nportalnovel\nportalnovel\n" | bubblewrap init --manifest="https://portalnovel.com.br" --directory=.
          printf "portalnovel\nportalnovel\n" | bubblewrap build --skipPwaValidation
          bubblewrap fingerprint generateAssetLinks --manifest="https://portalnovel.com.br"

      - name: Salvar Arquivos
        uses: actions/upload-artifact@v4
        with:
          name: portal-novel-playstore
          path: |
            app/app-release-bundle.aab
            app/app-release-signed.apk
            app/android.keystore
            app/assetlinks.json
            
