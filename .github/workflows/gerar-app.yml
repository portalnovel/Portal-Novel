name: Gerar App Play Store
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Arquivos Reais do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 e Node 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Ferramentas
        run: npm install -g @bubblewrap/cli http-server

      - name: Compilar App com Arquivos Locais do GitHub
        run: |
          mkdir -p ~/.bubblewrap app
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

          # Encontra a pasta onde estao o manifest.json e os icones reais no repositorio
          MANIFEST_PATH=$(find . -maxdepth 4 -name "manifest.json" | head -n 1)
          REPO_DIR=$(dirname "$MANIFEST_PATH")
          echo "Pasta encontrada: $REPO_DIR"

          # Inicia servidor local servindo a pasta real do seu repositorio
          http-server "$REPO_DIR" -p 8080 --silent &
          sleep 2

          # Localiza o icone real dentro da pasta encontrada
          ICON_REL=$(cd "$REPO_DIR" && find . -maxdepth 3 -iname "*512*.png" -o -iname "*icon*.png" | head -n 1 | sed 's|^\./||')
          echo "Icone encontrado: $ICON_REL"

          cd app
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass portalnovel -keypass portalnovel -dname "CN=Portal Novel, OU=Dev, O=Portal Novel, L=Sao Paulo, S=SP, C=BR"

          cat << EOF > twa-manifest.json
          {
            "packageId": "br.com.portalnovel.app",
            "host": "portalnovel.com.br",
            "name": "Portal Novel",
            "launcherName": "Portal Novel",
            "display": "standalone",
            "themeColor": "#111111",
            "themeColorDark": "#000000",
            "navigationColor": "#111111",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#111111",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#111111",
            "enableNotifications": true,
            "startUrl": "/#inicio",
            "iconUrl": "http://localhost:8080/$ICON_REL",
            "maskableIconUrl": "http://localhost:8080/$ICON_REL",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersionName": "1",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "http://localhost:8080/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://portalnovel.com.br",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "1"
          }
          EOF

          yes "" | bubblewrap update --skipPwaValidation
          printf "portalnovel\nportalnovel\n" | bubblewrap build --skipPwaValidation
          SHA256=$(keytool -list -v -keystore android.keystore -alias android -storepass portalnovel | grep "SHA256:" | sed 's/.*SHA256: //')
          echo "[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"android_app\",\"package_name\":\"br.com.portalnovel.app\",\"sha256_cert_fingerprints\":[\"$SHA256\"]}}]" > assetlinks.json

      - name: Baixar Pacote Final
        uses: actions/upload-artifact@v4
        with:
          name: portal-novel-playstore
          path: |
            app/app-release-bundle.aab
            app/app-release-signed.apk
            app/android.keystore
            app/assetlinks.json
            
