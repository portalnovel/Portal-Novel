name: Gerar App Play Store
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurar Caminhos do Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Criar Configuracao Direta do App
        run: |
          mkdir app && cd app
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "br.com.portalnovel.app",
            "host": "portalnovel.com.br",
            "name": "Portal Novel",
            "launcherName": "Portal Novel",
            "display": "standalone",
            "themeColor": "#111111",
            "themeColorDark": "#000000",
            "navigationColor": "#111111",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#111111",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#111111",
            "enableNotifications": true,
            "startUrl": "/#inicio",
            "iconUrl": "https://portalnovel.com.br",
            "maskableIconUrl": "https://portalnovel.com.br",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://portalnovel.com.br",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://portalnovel.com.br",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "1"
          }
          EOF

      - name: Gerar Chave e Compilar AAB
        run: |
          cd app
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass portalnovel -keypass portalnovel -dname "CN=Portal Novel, OU=Dev, O=Portal Novel, L=Sao Paulo, S=SP, C=BR"
          yes "" | bubblewrap update --skipPwaValidation
          printf "portalnovel\nportalnovel\n" | bubblewrap build --skipPwaValidation
          bubblewrap fingerprint generateAssetLinks --manifest="https://portalnovel.com.br" || true

      - name: Salvar Arquivos
        uses: actions/upload-artifact@v4
        with:
          name: portal-novel-playstore
          path: |
            app/app-release-bundle.aab
            app/app-release-signed.apk
            app/android.keystore
            app/assetlinks.json
            
